name: cloud-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: restore
        run: dotnet restore ThanyMarcus.slnx

      - name: build
        run: dotnet build ThanyMarcus.slnx -c Release --no-restore

      - name: test cloud (unit)
        run: |
          dotnet run \
            --project tests/ThanyMarcus.Cloud.UnitTests \
            -c Release --no-build --no-restore

      - name: test cloud (integration)
        run: |
          dotnet run \
            --project tests/ThanyMarcus.Cloud.IntegrationTests \
            -c Release --no-build --no-restore

  images:
    name: build cloud-api
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/cloud/Dockerfile
          push: false
          tags: thany-cloud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
